name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-gcc (for ring)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/ops-console
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp "$BIN" "dist/ops-console-linux-x86_64"
          cd dist && tar czf "ops-console-${VERSION}-linux-x86_64.tar.gz" ops-console-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
